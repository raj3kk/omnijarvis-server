name = "omnijarvis-hub"
main = "src/hub.ts"
compatibility_date = "2026-11-21"

# Durable Object: one per device (id = device:<device_id>).
# Hibernation API ONLY — plain accept() kabhi nahi (duration charge).
[[durable_objects.bindings]]
name = "JARVIS_HUB"
class_name = "JarvisHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JarvisHub"]

# D1 is THE store (D12 reframed 2026-11-21 — Supabase removed). Created via CF API 2026-11-21.
[[d1_databases]]
binding = "DB"
database_name = "omnijarvis-db"
database_id = "37a7ff24-9fd2-40f9-b122-82cdaea7e79d"

# B-3: Cloudflare Cron Trigger — the hub ticks itself every 5 min
# (scheduled() in src/hub.ts). GitHub Actions dispatcher stays as a
# fallback; ticks are idempotent, so both firing in one minute is safe.
# NOTE: deploy_omnijarvis_hub.py uploads via the Scripts API (wrangler.toml
# is NOT read by it), so the trigger must ALSO be set via the Cloudflare
# API schedules endpoint after deploy — this block is the source of truth.
[triggers]
crons = ["*/5 * * * *"]
