# Render Blueprint — OmniJarvis light worker (Phase 2, stage 2a-5).
# Free Web Service: 512 MB RAM, 0.1 CPU, 750 hrs/mo, 15-min sleep.
# Demo/smoke ONLY — no state on Render (ephemeral filesystem, no disk,
# no Postgres). Deploy: parent browser task (Render dashboard → New →
# Blueprint → connect raj3kk/omnijarvis-server, or New → Web Service with
# root render/worker). Flipify Gmail for the Render account.
services:
  - type: web
    name: omnijarvis-render
    env: python
    region: singapore
    plan: free
    rootDir: render/worker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
