name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/worker/requirements.txt
      - run: pip install -r render/worker/requirements.txt
      - name: Start worker + smoke-test
        run: |
          (uvicorn main:app --host 127.0.0.1 --port 8000 --app-dir render/worker & echo $! > /tmp/render.pid)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          body=$(curl -s -X POST http://127.0.0.1:8000/smoke/pdf)
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "SMOKE PDF FAILED"; exit 1; }
          echo "$body" | grep -q 'Hello OmniJarvis' || { echo "SAMPLE TEXT MISSING"; exit 1; }
          kill "$(cat /tmp/render.pid)" || true
