name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # R1 lint check (CI-only, report-only): no biome.json / eslint config
  # exists in this repo yet, so Biome runs with its defaults and its
  # findings NEVER fail the build. The job fails only if the linter
  # itself cannot run (npx/download failure) — same rule as the app's
  # ktlint report-only job. Pin the Biome version so a future Biome
  # release cannot silently change what "clean" means.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Linter presence check (Biome must be runnable)
        run: npx --yes @biomejs/biome@1.9.4 --version
      - name: Biome check (report-only — findings never fail CI)
        run: |
          npx --yes @biomejs/biome@1.9.4 check src/ licence-worker/worker.js || echo "::warning::Biome findings present (report-only; see the log above)"

  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/worker/requirements.txt
      - name: Install system deps (Tesseract + poppler + WeasyPrint libs + Devanagari font)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils fonts-lohit-deva libpango-1.0-0 libcairo2 libgdk-pixbuf-2.0-0
      - run: pip install -r render/worker/requirements.txt
      - run: pip install reportlab
      - name: Generate accuracy fixtures + run accuracy gate (10 synthetic docs, >= 0.85)
        run: |
          python render/worker/fixtures/generate.py
          python render/worker/accuracy_check.py
      - name: Start worker + smoke-test (health, smoke/pdf, doc endpoints, RSS < 512 MB)
        run: |
          (uvicorn main:app --host 127.0.0.1 --port 8000 --app-dir render/worker & echo $! > /tmp/render.pid)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          python render/worker/smoke_check.py http://127.0.0.1:8000 "$(cat /tmp/render.pid)"
          kill "$(cat /tmp/render.pid)" || true
