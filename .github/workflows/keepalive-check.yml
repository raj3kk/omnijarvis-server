# Keep-alive check — REAL queries, roz ek baar. Koi silent pass nahi:
# B-3 2026-11-21: same scheduler re-registration touch as dispatcher.yml —
# this schedule was created by the same API commit; disable/enable toggle
# 18:08Z did not prove re-registration, so this no-op comment forces
# GitHub to re-parse the workflow file. First scheduled run due 2026-11-22 03:30 UTC.
# - Hub keepalive (D1 devices + D1 licences, server-side): D1 fail =
#   workflow FAIL; licences state != ok = visible warning.
# - Qdrant: sirf tab chalta hai jab QDRANT_URL + QDRANT_API_KEY secrets set
#   hon (1 test vector upsert → query → delete — cluster active rehta hai);
#   nahi to visible warning step.
# (D1 migration 2026-11-21: Supabase fully removed — the old "Supabase
# direct check" step is deleted; tenants/jobs/skills/licences all live
# in D1 now and are probed via the hub keepalive step above.)
# Secrets parent ko set karne hain (dashboard/API se) — workflow unke bina
# bhi chalta hai aur summary me saaf likhta hai kya skip hua.
name: keepalive-check

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC, heartbeat commit ke baad
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hub keepalive (D1 devices + D1 licences, server-side)
        run: |
          set -e
          body=$(curl -s --max-time 30 "https://omnijarvis-hub.rajraj3kk.workers.dev/api/keepalive")
          echo "$body"
          ok=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok'))")
          state=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin)['checks']['licences']['state'])")
          count=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin)['checks']['licences'].get('count', 0))")
          echo "licences state: $state (count $count)"
          if [ "$state" != "ok" ]; then
            echo "::warning::Licences state is '$state' (D1 licences probe failed — see hub logs)."
          fi
          if [ "$ok" != "True" ]; then echo "HUB KEEPALIVE FAILED (D1)"; exit 1; fi

      # NOTE: `secrets` cannot be used in step `if:` conditions (GitHub
      # rejects the workflow with 422 "Unrecognized named-value:
      # 'secrets'") — so optional checks run unconditionally and branch
      # INSIDE the script on empty env vars (warning + exit 0 when the
      # secret is not set; real failure when the check itself fails).
      - name: Qdrant check (upsert → query → delete)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          set -e
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::warning::QDRANT check SKIPPED — QDRANT_URL / QDRANT_API_KEY secrets not set (parent: Qdrant Cloud free account)."
            exit 0
          fi
          H1="api-key: $QDRANT_API_KEY"
          H2="Content-Type: application/json"
          # Collection banani ho to banao (exists ho to 409 — theek hai).
          curl -s -o /dev/null -w "create collection HTTP %{http_code}\n" --max-time 30 \
            -X PUT "$QDRANT_URL/collections/keepalive" -H "$H1" -H "$H2" \
            -d '{"vectors":{"size":4,"distance":"Cosine"}}'
          curl -s -o /dev/null -w "upsert HTTP %{http_code}\n" --max-time 30 \
            -X PUT "$QDRANT_URL/collections/keepalive/points" -H "$H1" -H "$H2" \
            -d '{"points":[{"id":1,"vector":[0.1,0.2,0.3,0.4],"payload":{"check":"keepalive"}}]}'
          body=$(curl -s --max-time 30 -X POST "$QDRANT_URL/collections/keepalive/points/search" \
            -H "$H1" -H "$H2" -d '{"vector":[0.1,0.2,0.3,0.4],"limit":1}')
          echo "search: $body"
          echo "$body" | grep -q '"id":1' || { echo "QDRANT SEARCH FAILED"; exit 1; }
          curl -s -o /dev/null -w "delete HTTP %{http_code}\n" --max-time 30 \
            -X POST "$QDRANT_URL/collections/keepalive/points/delete" -H "$H1" -H "$H2" \
            -d '{"points":[1]}'
