# Cron dispatcher — ticks the hub every 5 minutes so due scheduled_jobs fire.
#
# Jitter is EXPECTED (GitHub Actions best-effort delays 5–30 min under load):
# "exact time" ka vaada kabhi nahi. Tick handler idempotency (job + minute)
# D1 traces se karta hai — double-fire safe hai.
#
# Secret: CRON_SECRET (GitHub repo secret; Worker secret me SAME value —
# deploy script se set hota hai). Value kabhi log me nahi aati.
# (D1 migration 2026-11-21: the old 503 schema_pending/config_missing
# gate is deleted — the hub has no such states anymore; any non-200 is
# a real failure now. Tick handler idempotency (job + minute) D1 traces
# se karta hai — double-fire safe hai.)
name: cron-dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick the hub
        run: |
          set -e
          code=$(curl -s -o /tmp/tick.json -w "%{http_code}" --max-time 30 \
            -X POST "https://omnijarvis-hub.rajraj3kk.workers.dev/api/cron/tick" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "tick HTTP $code: $(cat /tmp/tick.json)"
          if [ "$code" = "200" ]; then exit 0; fi
          echo "tick failed (HTTP $code)"; exit 1
